name: Build signed release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要發布的版本標籤，例如 v0.2.1（留空則只建置不發布）"
        required: false
        type: string

permissions:
  contents: write

env:
  # 既有正式版（v0.1.0 起）的簽章憑證指紋。用錯金鑰時使用者無法覆蓋更新，
  # 因此在 CI 直接擋下，避免發出安裝不上去的 APK。
  EXPECTED_SIGNING_CERT_SHA256: "414eb130a525a380661d9b65ff73ebe617359af9db05e6f2533d75dadaddf5dc"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::無法從 app/build.gradle.kts 解析 versionName。"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # 標籤須與 versionName 一致（v<versionName>），避免發出檔名與版號對不上的 APK。
          # 允許加上後綴（例如 v0.2.0-citest）作為測試版，會標記為 pre-release。
          PRERELEASE=false
          if [ -n "$TAG" ]; then
            if [ "$TAG" = "v${VERSION_NAME}" ]; then
              PRERELEASE=false
            elif [ "${TAG#v${VERSION_NAME}-}" != "$TAG" ]; then
              echo "偵測到測試標籤 ${TAG}，將標記為 pre-release。"
              PRERELEASE=true
            else
              echo "::error::標籤 ${TAG} 與 versionName ${VERSION_NAME} 不符，請先更新 app/build.gradle.kts 的版號再推標籤。"
              exit 1
            fi
          fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::找不到 KEYSTORE_BASE64 secret，無法建置已簽署的 APK。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-key.jks

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify APK signature
        shell: bash
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | tee apksigner-certs.txt

          ACTUAL=$(grep -oP 'certificate SHA-256 digest:\s*\K[0-9a-f]+' apksigner-certs.txt | head -n 1)
          if [ -z "$ACTUAL" ]; then
            echo "::error::無法從 apksigner 輸出解析簽章指紋。"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_SIGNING_CERT_SHA256" ]; then
            echo "::error::簽章金鑰與既有正式版不符，使用者將無法覆蓋更新（需先移除舊版並遺失所有紀錄）。"
            echo "::error::expected=$EXPECTED_SIGNING_CERT_SHA256 actual=$ACTUAL"
            exit 1
          fi
          echo "簽章指紋與既有正式版相符：$ACTUAL"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "LegRehabilitationTraining-v${{ steps.meta.outputs.version_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          # 只上傳單一 APK，關閉壓縮讓下載結果直接就是 .apk 而非需解壓的 zip。
          # 此模式下 name 會被忽略，artifact 名稱即為檔名。
          archive: false
          path: LegRehabilitationTraining-v${{ steps.meta.outputs.version_name }}.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f release-key.jks

      - name: Publish GitHub Release
        if: steps.meta.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          APK="LegRehabilitationTraining-v${{ steps.meta.outputs.version_name }}.apk"

          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            RELEASE_FLAGS="--prerelease"
          else
            RELEASE_FLAGS="--latest"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "腿部復健訓練 ${TAG}" \
              --generate-notes \
              $RELEASE_FLAGS
          fi
